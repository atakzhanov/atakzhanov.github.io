name: Build CV PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - "cv/**"
      - "Makefile"
      - ".github/workflows/build-cv.yml"

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inter font
        run: sudo apt-get update && sudo apt-get install -y fonts-inter

      - name: Build CV (EN + RU)
        run: make cv

      - name: Upload CV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            me/cv/aleksandr-takzhanov-cv-en.pdf
            me/cv/aleksandr-takzhanov-cv-ru.pdf
